[package]
name = "rust_rocket_sim"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "rust_rocket_sim"
path = "src/main.rs"

[dependencies]
rerun = "0.28"
nalgebra = "0.32"
clarabel = "0.7"
rand = "0.9"
rand_distr = "0.5"
ndarray = "0.15"
optimization_engine = "0.6.0"
ndarray-linalg = { version = "0.16", features = ["openblas-system"] }
csv = "1.4.0"
serde = { version = "1", features = ["derive"] }
Lander = { git = "https://github.com/Propulsive-Landers-GT/monoprop-flight-software.git" }
MPC = { git = "https://github.com/Propulsive-Landers-GT/control.git" }
rust_lossless = { git = "https://github.com/Propulsive-Landers-GT/guidance.git" }
openblas-src = { version = "0.10", features = ["rustls"] }
rayon = "1.12.0"
# Ground-station wire protocol, used by the `--ground-station` run mode.
# TODO: becomes a git dependency once the ground-station repo is pushed:
#       gs-protocol = { git = "https://github.com/Propulsive-Landers-GT/ground-station.git" }
gs-protocol = { path = "../../../ground-station/crates/gs-protocol" }

# ground-station-link development: build against the LOCAL Lander checkout (branch
# `ground-station-link` of monoprop-flight-software, cloned next to this repo), which has the
# telemetry module the `--ground-station` mode needs.
# TODO: remove this patch once that branch is merged, so the git dependency above is used again.
[patch."https://github.com/Propulsive-Landers-GT/monoprop-flight-software.git"]
Lander = { path = "../../../monoprop-flight-software/Lander" }
